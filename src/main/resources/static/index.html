<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剑客桌面伙伴</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/desktop.css">
</head>
<body>

<div id="desktop">
    <!-- Character overlay (always visible, managed by animation.js) -->
    <div id="character" class="character"></div>

    <!-- Main chat window -->
    <div id="chat-window" class="window" style="left: 50px; top: 30px; width: 420px;">
        <div class="window-header" data-window="chat-window">
            <span class="window-title">剑客对话</span>
            <div class="window-buttons">
                <button class="win-btn win-min" title="最小化">_</button>
                <button class="win-btn win-close" title="关闭">x</button>
            </div>
        </div>
        <div class="window-body">
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="和剑客说点什么吧..." autofocus>
                <button id="chat-send" class="btn-send">发送</button>
            </div>
        </div>
    </div>

    <!-- Conversation list window -->
    <div id="conv-list-window" class="window" style="left: 520px; top: 30px; width: 260px;">
        <div class="window-header" data-window="conv-list-window">
            <span class="window-title">对话列表</span>
            <div class="window-buttons">
                <button class="win-btn win-min" title="最小化">_</button>
                <button class="win-btn win-close" title="关闭">x</button>
            </div>
        </div>
        <div class="window-body">
            <button id="btn-new-conv" class="btn-new-conv">+ 新对话</button>
            <ul id="conv-list" class="conv-list"></ul>
        </div>
    </div>
</div>

<script src="/js/desktop.js"></script>
<script src="/js/animation.js"></script>
<script src="/js/chatHistory.js"></script>
<script src="/js/swordsmanAgent.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    AnimationEngine.init();
    Desktop.init();
    ChatHistory.init();
    SwordsmanAgentClient.init();
});
</script>
</body>
</html>
