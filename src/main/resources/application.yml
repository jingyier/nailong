tavily:
  api-key: ${TAVILY_API_KEY:your-tavily-key-here}
  mcp-url: https://mcp.tavily.com/mcp/

grsai:
  nanobanana:
    api-key: ${NANOBANANA_API_KEY:your-nanobanana-key-here}

nailong:
  agent:
    max-iterations: 10
    max-tokens: 5000
  character:
    personality: cheerful
    sleepy-timeout-minutes: 5

logging:
  level:
    org:
      springframework:
        ai: INFO
    io:
      modelcontextprotocol:
        client: ERROR